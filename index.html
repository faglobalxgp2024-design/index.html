<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>XGP Game V2</title>
  <style>
    :root{
      --bg1:#090b18; --bg2:#101735; --panel:rgba(8,12,26,.78); --line:#6de0ff;
      --text:#eef8ff; --muted:#9cc4d6; --warn:#ffd84d; --purple:#b45cff;
      --red:#ff6767; --green:#66f0a9;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:
      radial-gradient(circle at 20% 10%,rgba(125,249,255,.10),transparent 30%),
      radial-gradient(circle at 80% 20%,rgba(180,92,255,.12),transparent 26%),
      linear-gradient(180deg,var(--bg2),var(--bg1));color:var(--text);
      font-family:Arial,Helvetica,sans-serif}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
    #gameWrap{position:relative;width:min(100vw,520px);height:100vh;max-height:920px}
    canvas{display:block;width:100%;height:100%;border:2px solid var(--line);border-radius:18px;
      box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 0 80px rgba(109,224,255,.08);background:
      linear-gradient(180deg,#0a0f22 0%, #060812 100%)}
    .hud{position:absolute;left:10px;right:10px;top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;z-index:10}
    .card{background:var(--panel);border:1px solid rgba(109,224,255,.35);border-radius:12px;padding:10px;backdrop-filter:blur(4px)}
    .k{font-size:11px;color:var(--muted)} .v{font-size:18px;font-weight:700;margin-top:4px}
    #leftBtns{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;z-index:10}
    button{border:1px solid rgba(109,224,255,.4);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}
    #leader{position:absolute;right:10px;top:92px;width:180px;z-index:10}
    #leader h3{margin:0 0 8px;font-size:14px}
    #leader ol{margin:0;padding-left:20px;font-size:12px;line-height:1.45;max-height:220px;overflow:auto}
    #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;text-align:center;
      padding:16px 18px;background:rgba(7,10,22,.88);border:1px solid rgba(109,224,255,.42);border-radius:14px;min-width:260px}
    #msg h1{margin:0 0 8px;font-size:22px} #msg p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
    #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:20;background:rgba(6,10,20,.88);
      border:1px solid rgba(109,224,255,.38);padding:10px 14px;border-radius:10px;display:none}
    #mobilePad{position:absolute;left:14px;bottom:70px;width:90px;height:90px;border-radius:50%;
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:none;z-index:11}
    #mobileKnob{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);
      background:rgba(109,224,255,.36);border:1px solid rgba(109,224,255,.75)}
    @media (max-width:700px){
      .hud{grid-template-columns:repeat(2,1fr)}
      #leader{width:150px;top:150px}
      #mobilePad{display:block}
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="gameWrap">
      <canvas id="game" width="520" height="920"></canvas>

      <div class="hud">
        <div class="card"><div class="k">STAR</div><div class="v" id="starVal">0</div></div>
        <div class="card"><div class="k">RANK</div><div class="v" id="rankVal">0</div></div>
        <div class="card"><div class="k">LEVEL</div><div class="v" id="levelVal">1</div></div>
        <div class="card"><div class="k">BONUS</div><div class="v" id="bonusVal">0.0%</div></div>
      </div>

      <div id="leader" class="card">
        <h3>LEADERBOARD</h3>
        <ol id="leaderList"></ol>
      </div>

      <div id="leftBtns">
        <button id="upgradeBtn">UPGRADE</button>
        <button id="restartBtn">RESTART</button>
      </div>

      <div id="mobilePad"><div id="mobileKnob"></div></div>

      <div id="toast"></div>

      <div id="msg">
        <h1>XGP GAME V2</h1>
        <p>Collect yellow stars for STAR currency.<br>Collect purple stars for RANK points.<br>Avoid bombs.</p>
        <button id="startBtn">START GAME</button>
      </div>
    </div>
  </div>

  <script src="./hub.js"></script>
</body>
</html>
