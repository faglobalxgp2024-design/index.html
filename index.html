
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XGP SPACE RUN V10</title>
<style>
body{margin:0;background:#030611;color:#fff;font-family:Arial;overflow:hidden}
canvas{display:block}
.hud{position:absolute;top:6px;left:6px;display:flex;gap:8px;font-size:12px}
.box{background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px}
.menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
button{padding:10px 18px;margin:6px;border-radius:6px;border:none;background:#2b9cff;color:#fff}
#shop,#skins,#missions,#leader{display:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
<div class="box">STAR <span id="star">0</span></div>
<div class="box">RANK <span id="rank">0</span></div>
<div class="box">LEVEL <span id="level">1</span></div>
<div class="box">COMBO <span id="combo">1x</span></div>
</div>

<div class="menu" id="menu">
<h1>XGP SPACE RUN</h1>
<button onclick="startGame()">START</button>
<button onclick="openShop()">SHOP</button>
<button onclick="openSkins()">SKINS</button>
<button onclick="openMissions()">MISSIONS</button>
<button onclick="openLeader()">LEADERBOARD</button>
</div>

<div class="menu" id="shop">
<h2>UPGRADE</h2>
<button onclick="upgrade()">UPGRADE (100 STAR)</button>
<br><button onclick="closeMenus()">BACK</button>
</div>

<div class="menu" id="skins">
<h2>SHIP SKINS</h2>
<div id="skinList"></div>
<button onclick="closeMenus()">BACK</button>
</div>

<div class="menu" id="missions">
<h2>DAILY MISSIONS</h2>
<div id="missionList"></div>
<button onclick="closeMenus()">BACK</button>
</div>

<div class="menu" id="leader">
<h2>TOP 20</h2>
<div id="leaderList"></div>
<button onclick="closeMenus()">BACK</button>
</div>

<script src="firebase-config.js"></script>
<script src="hub.js"></script>
</body>
</html>
