  <style>
    :root{
      --bg:#2b0d0d;
      --panel:#3a1212;
      --line:#ffb347;
      --txt:#fff6e6;
      --muted:#ffd9a6;
      --accent:#ff9a3c;

      --warn:#ffd166;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
      linear-gradient(
        135deg,
        #ffcf6e 0%,
        #ff9a3c 30%,
        #ff5e3a 60%,
        #b31217 100%
        ),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 40%);
      color:var(--txt);
      font-family:"Press Start 2P", system-ui, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      overflow:hidden;
    }

    /* 픽셀 반짝이 배경 (CSS 애니메이션) */
    .stars{
      position:fixed; inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(#ffffff55 1px, transparent 1px),
        radial-gradient(#ffffff33 1px, transparent 1px),
        radial-gradient(#ffffff22 1px, transparent 1px);
      background-size: 70px 70px, 110px 110px, 160px 160px;
      background-position: 0 0, 30px 60px, 80px 20px;
      animation: starMove 12s linear infinite;
      opacity:.35;
    }
    @keyframes starMove{
      from{ transform: translateY(0); }
      to{ transform: translateY(120px); }
    }

    /* ===== 폭발 이펙트 ===== */
.explosion{
  position:absolute;
  width:110px;
  height:110px;
  transform: translate(-50%, -50%);
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0 18%, transparent 19%),
    radial-gradient(circle at 50% 50%, rgba(255,210,90,.95) 0 34%, transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(255,80,80,.9) 0 52%, transparent 53%);
  filter: drop-shadow(0 0 14px rgba(255,120,60,.9));
  border-radius:999px;
  animation: boom .45s ease-out forwards;
}

.explosion::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:999px;
  border:2px dashed rgba(255,210,90,.65);
  animation: ring .45s ease-out forwards;
}

@keyframes boom{
  0%{ transform: translate(-50%, -50%) scale(0.4); opacity:0; }
  20%{ opacity:1; }
  70%{ transform: translate(-50%, -50%) scale(2.2); opacity:1; }
  100%{ transform: translate(-50%, -50%) scale(3); opacity:0; }
}

@keyframes ring{
  0%{ transform: scale(.2); opacity:.8; }
  100%{ transform: scale(1.15); opacity:0; }
}

  width:100%;
  max-width:520px;
}

    /* 플레이어(피하는 캐릭터) */
  .player{
  position:absolute;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;

  transform-origin: 50% 80%;
  will-change: transform;  

  animation: playerBob 1.15s ease-in-out infinite;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
}
.player svg{ width:100%; height:100%; display:block; }
    
.player .robot{ width:100%; height:100%; }

@keyframes playerBob{
  0%,100%{ transform: translateY(0) rotate(-1deg); }
  50%{ transform: translateY(-2px) rotate(1deg); }
}

.player .rb-eye{
  transform-origin:center;
  animation: rbBlink 4.2s infinite;
}
@keyframes rbBlink{
  0%,92%,100%{ transform: scaleY(1); }
  94%,96%{ transform: scaleY(0.15); }
}

.player .rb-antenna{
  transform-origin:32px 14px;
  animation: rbWiggle 1.6s ease-in-out infinite;
}
@keyframes rbWiggle{
  0%,100%{ transform: rotate(0deg); }
  50%{ transform: rotate(6deg); }
}

.player .rb-scan{
  animation: rbScan 1.6s linear infinite;
}
@keyframes rbScan{
  0%{ opacity:0; transform: translateX(-6px); }
  15%{ opacity:.35; }
  50%{ opacity:.35; transform: translateX(18px); }
  70%,100%{ opacity:0; transform: translateX(18px); }

      /* 장애물(폭탄 캐릭터) - CSS로 직접 그림 (배경 대비 강함) */
.hazard{
  position:absolute;
  width:30px;
  height:30px;

  /* 배경 이미지 제거 */
  background: radial-gradient(circle at 30% 28%, #ffffffaa 0 12%, transparent 13%),
              radial-gradient(circle at 35% 35%, #2b2f3a 0 55%, #0d0f14 56% 100%);
  border-radius: 50%;

  /* 밝은 외곽선 + 입체감 */
  box-shadow:
    0 0 0 2px rgba(255,255,255,.95),     /* 흰 테두리 */
    0 0 0 5px rgba(0,0,0,.35),           /* 바깥 그림자 링 */
    0 10px 18px rgba(0,0,0,.45);         /* 아래 그림자 */

  filter: drop-shadow(0 0 10px rgba(255,120,60,.35));
  animation: bombWiggle .55s ease-in-out infinite;
}

/* 폭탄 심지(위쪽) */
.hazard::before{
  content:"";
  position:absolute;
  width:14px;
  height:10px;
  left:18px;
  top:-2px;

  /* 심지 줄 */
  background: linear-gradient(180deg, #d9b48f, #7a5a3a);
  border-radius: 8px;
  transform: rotate(-18deg);

  box-shadow:
    0 0 0 2px rgba(255,255,255,.85),
    0 6px 10px rgba(0,0,0,.35);
}

/* 불꽃(깜빡임) */
.hazard::after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  left:26px;
  top:-10px;

  background:
    radial-gradient(circle at 40% 40%, #fff8c7 0 25%, transparent 26%),
    radial-gradient(circle at 50% 60%, #ffd166 0 45%, transparent 46%),
    radial-gradient(circle at 50% 70%, #ff6a3d 0 70%, transparent 71%);
  border-radius: 50% 50% 50% 50%;
  transform: rotate(10deg);

  filter: drop-shadow(0 0 8px rgba(255,170,60,.9));
  animation: fuseFlicker .18s ease-in-out infinite alternate;
}

/* 폭탄 흔들림 */
@keyframes bombWiggle{
  0%,100%{ transform: translateX(0) rotate(-2deg) scale(1); }
  50%{ transform: translateX(1px) rotate(2deg) scale(1.03); }
}

/* 불꽃 깜빡임 */
@keyframes fuseFlicker{
  from{ transform: translateY(0) scale(0.95) rotate(10deg); opacity:.9; }
  to{ transform: translateY(-1px) scale(1.1) rotate(2deg); opacity:1; }
}
 
    @keyframes bombPulse{
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 코인(XGP채굴수량) */

    }

    /* 히트(맞았을 때) 흔들림 */

      0%{ transform: translate(0,0); }

  <script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const hardBtn = document.getElementById("hardBtn");    
// ===== 폭발 이펙트 함수 (여기에 추가!!) =====
function spawnExplosionAt(el){
  const gr = game.getBoundingClientRect();
  const r = el.getBoundingClientRect();

  const ex = document.createElement("div");
  ex.className = "explosion";

  const cx = (r.left + r.right) / 2 - gr.left;
  const cy = (r.top + r.bottom) / 2 - gr.top;

  ex.style.left = Math.round(cx) + "px";
  ex.style.top  = Math.round(cy) + "px";

  game.appendChild(ex);
  setTimeout(() => ex.remove(), 500);
}


// ===== BGM (외부 파일 없이 루프) =====
    // ===== BGM (외부 파일 없이 루프) =====
// ===== BGM: 신나는 8-bit 멜로디 루프 =====
let bgmOn = true;
let bgmTimer = null;
let bgmStep = 0;
let bgmTempo = 150; // 신나게(원하면 140~165)

const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00
};

function playTone(freq, dur=0.11, type="square", vol=0.05){
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function snare(){
  if (!audioCtx || audioCtx.state !== "running") return;
  const t = audioCtx.currentTime;
  const dur = 0.045;

  const bufferSize = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.035, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(gain);
  gain.connect(audioCtx.destination);

  src.start(t);
  src.stop(t + dur + 0.02);
}

function kick(){
  playTone(90, 0.06, "sine", 0.09);
  setTimeout(()=>playTone(60, 0.05, "sine", 0.06), 15);
}

// ===== 패턴(지루하지 않게 2파트 + 가끔 필인) =====
const melodyA = [
  "E5",null,"G5",null, "A5",null,"G5",null,
  "E5",null,"D5",null, "C5",null,"D5",null
];
const leadA = [
  null,"C5",null,"D5", null,"E5",null,"G5",
  null,"C5",null,"D5", null,"E5",null,"G5"
];
const bassA = [
  "C3",null,"C3",null, "A3",null,"A3",null,
  "F3",null,"F3",null, "G3",null,"G3",null
];
const drumA = [
  1,0,0,0, 2,0,1,0,
  1,0,0,0, 2,0,1,0
];

// 파트B(다른 멜로디로 변주)
const melodyB = [
  "G5",null,"A5",null, "B5",null,"A5",null,
  "G5",null,"E5",null, "D5",null,"E5",null
];
const leadB = [
  null,"D5",null,"E5", null,"G5",null,"A5",
  null,"D5",null,"E5", null,"G5",null,"A5"
];
const bassB = [
  "A3",null,"A3",null, "F3",null,"F3",null,
  "G3",null,"G3",null, "C3",null,"C3",null
];
const drumB = [
  1,0,0,2, 0,0,1,0,
  1,0,0,2, 0,2,1,0
];

// 필인(가끔만 사용, 짧게 난리나게)
const fillMelody = [
  null,"E5","G5","A5", null,"G5","E5","D5",
  null,"E5","G5","A5", null,"B5","A5","G5"
];
const fillDrum = [
  1,2,1,2, 1,2,1,2,
  1,2,1,2, 1,2,1,2
];

// 몇 마디 진행했는지 (16스텝=1마디)
let bgmBar = 0;

function bgmTick(){
  if (!bgmOn) return;

  const stepMs = (60000 / bgmTempo) / 4;
  const i = bgmStep % 16;

  // 4마디 단위로 A <-> B 교대 (지루함 방지)
  const useB = (Math.floor(bgmBar / 4) % 2) === 1;

  // 8마디마다 1마디 필인 확률(50%)로 넣기
  const isFillBar = (bgmBar > 0 && bgmBar % 8 === 0 && Math.random() < 0.5);

  // 현재 선택할 패턴
  const M = isFillBar ? fillMelody : (useB ? melodyB : melodyA);
  const L = useB ? leadB : leadA;
  const B = useB ? bassB : bassA;
  const D = isFillBar ? fillDrum : (useB ? drumB : drumA);

  // 멜로디
  const m = M[i];
  if (m) playTone(NOTE[m], 0.11, "square", 0.058);

  // 리드(너무 시끄러우면 0.02~0.03으로 낮춰)
  const l = L[i];
  if (l && !isFillBar) playTone(NOTE[l], 0.09, "triangle", 0.03);

  // 베이스
  const b = B[i];
  if (b) playTone(NOTE[b], 0.10, "triangle", 0.045);

  // 드럼
  const d = D[i];
  if (d === 1) kick();
  if (d === 2) snare();

  // 스텝 증가
  bgmStep = (bgmStep + 1) % 16;

  // 마디 카운트(스텝이 0으로 돌아오면 1마디 끝)
  if (bgmStep === 0) bgmBar++;

  bgmTimer = setTimeout(bgmTick, stepMs);
}

function startBGM(){
  if (bgmTimer) return;
  bgmOn = true;
  bgmStep = 0;
  ensureAudioReady().then(() => {
    if (!bgmTimer) bgmTick();
  }).catch(()=>{});
}

function stopBGM(){
  bgmOn = false;
  if (bgmTimer){
    clearTimeout(bgmTimer);
    bgmTimer = null;
  }
}

// ===== SFX (외부 파일 없이 100% 동작) =====
let audioCtx = null;
let audioReady = null;

function ensureAudioReady(){
  if (!audioReady) audioReady = initAudio();
  return audioReady;
}

async function initAudio(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state !== "running") {
    try { await audioCtx.resume(); } catch(e) {}
  }
}

// 비프음 생성기
function beep({ freq=440, dur=0.08, type="square", vol=0.18, endFreq=null } = {}){
  if (!audioCtx || audioCtx.state !== "running") return;

  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t + dur);
  }

  // 클릭 방지 엔벨로프
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// 효과음 3종
function sfxStart(){
  ensureAudioReady().then(() => {
    beep({ freq: 523, dur: 0.06, type:"square", vol:0.12 });
    setTimeout(() => beep({ freq: 659, dur: 0.07, type:"square", vol:0.12 }), 70);
  }).catch(()=>{});
}

function sfxCoin(){
  ensureAudioReady().then(() => {
    beep({ freq: 880, dur: 0.05, type:"triangle", vol:0.10, endFreq: 1200 });
  }).catch(()=>{});
}

function sfxOver(){
  ensureAudioReady().then(() => {
    // 펑! (짧고 굵게)
    beep({ freq: 140, dur: 0.10, type:"square",  vol:0.28, endFreq: 70 });
    // 찌지직 + 잔향 느낌
    setTimeout(() => beep({ freq: 90, dur: 0.12, type:"sawtooth", vol:0.22, endFreq: 40 }), 70);
    // 작은 파편 느낌
    setTimeout(() => beep({ freq: 220, dur: 0.05, type:"triangle", vol:0.18, endFreq: 160 }), 130);
  }).catch(()=>{});
}

    
    const timeEl = document.getElementById("time");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    const ovTitle = document.getElementById("ovTitle");
    const ovDesc = document.getElementById("ovDesc");
    const ovBig  = document.getElementById("ovBig");

    // 상태
    let running = false;
    let t0 = 0;
    let raf = null;
    let score = 0;
    let best = Number(localStorage.getItem("pixel_dodge_best") || 0);

    // 플레이어 좌표(픽셀 느낌이라 정수로)
    let px = 0; // left in px (0 ~ max)
    const isMobile = matchMedia("(max-width: 600px)").matches;
const pSize = isMobile ? 52 : 40;

    // 난이도
    const modes = [
      { name:"EASY", hazardRate: 650, hazardSpeed: 220, coinRate: 1100, coinSpeed: 150 },
      { name:"HARD", hazardRate: 430, hazardSpeed: 290, coinRate: 1300, coinSpeed: 175 }
    ];
    let modeIdx = 0;

    bestEl.textContent = best;

    function gameRect(){
      return game.getBoundingClientRect();
    }

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function setPlayerX(x){
  const rect = gameRect();
  const max = rect.width - pSize;
  px = clamp(Math.round(x), 0, Math.round(max));
  player.style.left = px + "px";   // ✅ center 보정 제거
}

    function reset(){
      stop();
      // 제거
      [...game.querySelectorAll(".hazard,.coin,.pop")].forEach(el => el.remove());
      player.style.width  = pSize + "px";
      player.style.height = pSize + "px";
      score = 0;
      scoreEl.textContent = score;
      timeEl.textContent = "0.0";
      // 플레이어 중앙
      const rect = gameRect();
      setPlayerX(rect.width/2 - pSize/2);
      player.style.top = Math.round(rect.height * 0.80) + "px";

      showOverlay("시작 준비!", "빨간 장애물을 피하면서<br/>노란 코인을 먹어 점수를 올리세요.", "START");
    }

    function showOverlay(title, desc, big){
      ovTitle.textContent = title;
      ovDesc.innerHTML = desc;
      ovBig.textContent = big;
      overlay.style.display = "flex";
    }
    function hideOverlay(){ overlay.style.display = "none"; }

    // 충돌 체크
    function hit(a, b){
      const ar = a.getBoundingClientRect();
      const br = b.getBoundingClientRect();
      return !(ar.right < br.left || ar.left > br.right || ar.bottom < br.top || ar.top > br.bottom);
    }

    // 팝업
    function popText(x, y, text){
      const el = document.createElement("div");
      el.className = "pop";
      el.textContent = text;
      el.style.left = x + "px";
      el.style.top = y + "px";
      game.appendChild(el);
      setTimeout(()=> el.remove(), 750);
    }

    // 장애물/코인 생성
    function spawnHazard(){
      const rect = gameRect();
      const el = document.createElement("div");
      el.className = "hazard";
      el.style.left = Math.round(Math.random() * (rect.width - 30)) + "px";
      el.style.top = "-30px";
      el.dataset.y = "-30";
      game.appendChild(el);
      return el;
    }

    function spawnCoin(){
      const rect = gameRect();
      const el = document.createElement("div");
      el.className = "coin";
      el.style.left = Math.round(Math.random() * (rect.width - 26)) + "px";
      el.style.top = "-26px";
      el.dataset.y = "-26";
      game.appendChild(el);
      return el;
    }

    // 이동 업데이트
    function tick(now){
      if (!running) return;
      const dt = (now - t0) / 1000;
      t0 = now;

      // 시간 표시
      const lived = (performance.now() - startAt) / 1000;
      timeEl.textContent = lived.toFixed(1);

      const rect = gameRect();
      const hazards = [...game.querySelectorAll(".hazard")];
      const coins = [...game.querySelectorAll(".coin")];

      // 내려오기
      const m = modes[modeIdx];

      // ===== 시간 기반 속도 배율 =====
let speedMultiplier = 1;

// 10초부터 증가 → 120초에 2배
const progress = Math.min(Math.max((lived - 10) / 110, 0), 1);
speedMultiplier = 1 + progress; // 최대 2배


      hazards.forEach(h => {
        let y = Number(h.dataset.y);
        y += m.hazardSpeed * speedMultiplier * dt;
        h.dataset.y = y;
        h.style.top = Math.round(y) + "px";
        if (y > rect.height + 40) h.remove();
        else if (hit(player, h)) {
  spawnExplosionAt(h); // 폭발 이펙트
  gameOver();          // 게임오버(사운드 포함)
}
      });

      coins.forEach(c => {
        let y = Number(c.dataset.y);
        y += m.coinSpeed * (speedMultiplier * 1.5) * dt;
        c.dataset.y = y;
        c.style.top = Math.round(y) + "px";
        if (y > rect.height + 40) c.remove();
        else if (hit(player, c)) {
          sfxCoin();
          
          c.remove();
          score += 1;
          scoreEl.textContent = score;
          const pr = player.getBoundingClientRect();
          const gr = rect;
          popText(Math.round(pr.left - gr.left), Math.round(pr.top - gr.top - 8), "+1");
        }
      });

      raf = requestAnimationFrame(tick);
    }

    let hazardTimer = null;
    let coinTimer = null;
    let startAt = 0;

function start(){

  reset(); // ⭐ 먼저 초기화

  startBGM(); // ⭐ 초기화 후 BGM

  hideOverlay();
  running = true;

  startAt = performance.now();
  t0 = performance.now();

  const m = modes[modeIdx];

  hazardTimer = setInterval(spawnHazard, m.hazardRate);
  coinTimer = setInterval(spawnCoin, m.coinRate);

  raf = requestAnimationFrame(tick);
}

    function stop(){
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      clearInterval(hazardTimer);
      clearInterval(coinTimer);
      hazardTimer = null;
      coinTimer = null;
    }

    function gameOver(){
      if (!running) return;
      stop();
      stopBGM();
      sfxOver();

      // 기록 업데이트(생존시간+코인점수 느낌: 점수에 시간 보너스)
      const lived = (performance.now() - startAt) / 1000;
      const final = Math.floor(score * 10 + lived * 5);

      if (final > best) {
        best = final;
        localStorage.setItem("pixel_dodge_best", String(best));
        bestEl.textContent = best;
      }

      game.classList.remove("shake");
      void game.offsetWidth; // reflow for restart animation
      game.classList.add("shake");

      showOverlay("게임 오버!", `최종 점수: <b style="color:var(--txt)">${final}</b><br/>코인: ${score} / 생존: ${lived.toFixed(1)}s`, "RETRY");
      startBtn.textContent = "다시 시작";
    }

    // 입력(키보드)
    const keyState = { left:false, right:false };
    function moveBy(dx){
      setPlayerX(px + dx);
    }
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keyState.left = true;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keyState.right = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keyState.left = false;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keyState.right = false;
    });

    // 키 입력으로 부드럽게 이동(raf)
    function controlLoop(){
      const speed = 6; // 픽셀 이동
      if (keyState.left) moveBy(-speed);
      if (keyState.right) moveBy(speed);
      requestAnimationFrame(controlLoop);
    }
    requestAnimationFrame(controlLoop);

    // 입력(모바일 드래그)
    let dragging = false;
    function pointerX(e){
  const rect = gameRect();
  const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
  let x = clientX - rect.left;

  // 👉 손가락 가림 방지 (오른손 기준)
  if (e.touches) x -= 28;

  return x - pSize/2;
}
    game.addEventListener("mousedown", (e)=>{ dragging = true; setPlayerX(pointerX(e)); });
    window.addEventListener("mousemove", (e)=>{ if(dragging) setPlayerX(pointerX(e)); });
    window.addEventListener("mouseup", ()=> dragging = false);

    game.addEventListener("touchstart", (e)=>{ dragging = true; setPlayerX(pointerX(e)); }, {passive:false});
    game.addEventListener("touchmove", (e)=>{ if(dragging) setPlayerX(pointerX(e)); }, {passive:false});
    game.addEventListener("touchend", ()=> dragging = false);

    // 버튼
startBtn.addEventListener("click", () => {

  ensureAudioReady().then(() => {
    sfxStart();
    start();
  }).catch(() => {
    start();
  });

});

    restartBtn.addEventListener("click", () => reset());

    hardBtn.addEventListener("click", () => {
      modeIdx = (modeIdx + 1) % modes.length;
      hardBtn.textContent = "난이도: " + modes[modeIdx].name;
      reset();
    });

    // 처음 로드 시 중앙 배치
    window.addEventListener("resize", () => {
      const rect = gameRect();
      setPlayerX(rect.width/2 - pSize/2);
    });

    reset();
  </script>
